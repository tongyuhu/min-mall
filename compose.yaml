name: mini-mall
services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mini_mall}
      MYSQL_USER: ${MYSQL_USER:-mall}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置数据库密码}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置数据库管理密码}
      TZ: UTC
    ports: ["127.0.0.1:${MYSQL_PORT:-13306}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.12-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置缓存密码}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 18080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["127.0.0.1:${SERVER_PORT:-18080}:18080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  mysql-data:
  redis-data:
